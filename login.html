<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="module">
    import { generateTabName, removeRecentAuthTabIfCurrent } from './util.js';
    import * as auth from './auth.js';

    if (!window.name)
      window.name = generateTabName();

    window.addEventListener('beforeunload', removeRecentAuthTabIfCurrent);

    if (auth.getCurrentUser())
      document.location.href = 'home.html';
  </script>
</head>

<body class="flex justify-center items-center min-h-screen bg-neutral-100">
  <main class="w-3/4 md:w-1/2 p-4 shadow-xl">
    <h1 class="text-2xl mb-4">
      log in
    </h1>

    <form class="flex flex-col gap-2">
      <div class="flex justify-between">
        <label for="email">email</label>
        <input name="email" id="email" type="email"
          class="border-b-2 border-neutral-400 hover:border-black focus:border-black focus:outline-none w-32 md:w-48 lg:w-96">
      </div>

      <div class="flex justify-between">
        <label for="password">password</label>
        <input name="password" id="password" type="password"
          class="border-b-2 border-neutral-400 hover:border-black focus:border-black focus:outline-none w-32 md:w-48 lg:w-96">
      </div>

      <p id="login-error" class="text-red-500">
      </p>

      <div class="mt-2">
        <button type="submit"
          class="bg-rose-500 py-2 px-4 rounded text-white cursor-pointer hover:scale-105 hover:shadow-2xl transition-all">
          log in
        </button>
        or
        <button id="redirect-to-signup" type="button"
          class="text-rose-600 cursor-pointer hover:scale-105 hover:shadow-2xl transition-all">
          sign up
        </button>
      </div>
    </form>
  </main>

  <script type="module" src="login.js"></script>
</body>

</html>
