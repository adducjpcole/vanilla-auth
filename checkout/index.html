<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="importmap">
    {
      "imports": {
        "@/": "../util/"
      }
    }
  </script>
  <script type="module" src="./components/CartItemDisplay/index.js"></script>
</head>

<body class="flex flex-col min-h-screen bg-neutral-100">

  <!-- Header -->
  <header class="flex sticky top-0 z-10 justify-between items-center py-6 px-16 bg-white">
    <h1 class="text-4xl font-bold text-rose-500 cursor-pointer">Checkout</h1>

    <a href="../" class="flex text-sm items-center justify-center text-neutral-500 group hover:text-black">
      <span class="text-base mr-1">&larr;</span> Back to Shop
    </a>
  </header>

  <!-- Main -->
  <main class="flex-1 flex flex-col lg:flex-row gap-6 px-16 py-6">
    <section class="w-full bg-white p-6 rounded shadow-md flex flex-col gap-4 h-fit">
      <h2 class="text-xl font-semibold">Order Summary</h2>

      <div id="cart-item-displays" class="flex flex-col gap-3 text-sm text-neutral-600">
      </div>

      <div class="flex justify-between font-semibold">
        <p>Total</p>
        <p>$<span id="total">0.00</span></p>
      </div>

      <button id="place-order"
        class="group relative bg-rose-500 text-white py-2 rounded not-disabled:hover:scale-105 not-disabled:hover:shadow-md not-disabled:active:scale-95 not-disabled:active:shadow-none disabled:bg-transparent disabled:text-transparent transition-all">
        Place Order

        <div id="place-order-loader"
          class="absolute hidden group-disabled:flex justify-center items-center z-10 top-0 left-0 right-0 pointer-events-none h-full">
          <img src="../public/loader-circle [rose-500].png" class="animate-spin size-8" />
        </div>
      </button>
    </section>

  </main>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 z-50">
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
