<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script type="importmap">
      {
        "imports": {
          "@/": "./util/"
        }
      }
    </script>
  <script type="module" src="./components/ProductDisplay/index.js"></script>
  <script type="module" src="./components/DualRangeInput/index.js"></script>
</head>

<body class="flex flex-col min-h-screen bg-neutral-100">
  <!-- Header -->
  <header class="flex justify-between items-center py-6 px-16 bg-white">
    <div>
      <h1 class="text-4xl font-bold text-rose-500">Shopping</h1>
    </div>

    <div class="flex items-center gap-4 relative">
      <button id="checkout" class="cursor-pointer size-8 relative">
        <img src="./public/shopping-cart.png" alt="Your shopping cart" />
        <p id="cart-size"
          class="absolute -top-2 -right-2 items-center justify-center hidden px-2 rounded-full aspect-square text-xs bg-rose-500 font-bold text-white transition-all">
        </p>
      </button>

      <button class="cursor-pointer size-8" id="dropdown1-btn">
        <img src="./public/circle-user-round.png" alt="Your profile picture" />
      </button>
      <div id="dropdown1-menu" class="hidden absolute top-8 right-0 w-max mt-2 bg-white shadow-lg rounded p-4 z-10">
        <div class="flex flex-col gap-2 items-center">
          <button id="signup" type="button"
            class="@unauth bg-rose-500 py-2 px-4 rounded text-white cursor-pointer hover:scale-105 hover:shadow-2xl transition-all w-full">
            Sign Up
          </button>
          <button id="login" type="button"
            class="@unauth bg-rose-500 py-2 px-4 rounded text-white cursor-pointer hover:scale-105 hover:shadow-2xl transition-all w-full">
            Log In
          </button>

          <p class="@auth $email text-sm">email@email.com</p>
          <img src="./public/circle-user-round.png" alt="Your profile picture" class="@auth size-14" />
          <p class="@auth">Hi, <span class="$username">Username</span>!</p>
          <button id="logout" type="button"
            class="@auth bg-rose-500 py-2 px-4 rounded text-white cursor-pointer hover:scale-105 hover:shadow-2xl transition-all w-full">
            Log Out
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 flex flex-col-reverse lg:flex-row items-stretch justify-between py-4 px-16 gap-4">

    <section class="flex-1 flex flex-col">
      <header class="flex sticky justify-between items-center pb-2">
        <p>
          SHOWING <span id="products-start">1</span> -
          <span id="products-end">25</span>
        </p>

        <form>
          <select name="category" id="category" class="outline-none">
            <option value="" name="" selected>ALL</option>
          </select>
        </form>
      </header>

      <div id="product-displays"
        class="not-[&:has(product-display)]:flex not-[&:has(product-display)]:items-center not-[&:has(product-display)]:justify-center not-[&:has(product-display)]:flex-1 has-[product-display]:grid has-[product-display]:grid-cols-3 has-[product-display]:lg:grid-cols-4 gap-4">
      </div>

      <footer class="flex w-full justify-between px-2 py-4">
        <button id="prev-page" class="cursor-pointer text-neutral-500 hover:text-black disabled:invisible" type="button"
          disabled>
          Previous
        </button>
        <button id="next-page" class="cursor-pointer text-neutral-500 hover:text-black disabled:invisible" type="button"
          disabled>
          Next
        </button>
      </footer>
    </section>

    <aside class="w-full lg:w-1/4">
      <p class="font-semibold">Filter by price</p>
      <dual-range-input id="price-range" min="0" max="2000" step="10" value-min="0" value-max="2000"></dual-range-input>
      <div class="flex justify-between">
        <p id="value-min-price"></p>
        <p id="value-max-price"></p>
      </div>
    </aside>

  </main>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 z-50">
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
